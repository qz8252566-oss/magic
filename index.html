<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090b13">
    <title>HAND MAGIC — 手から始まる魔法バトル</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" data-action="title" aria-label="HAND MAGIC ホーム">
          <span class="brand-mark">✳</span>
          <span>HAND <b>MAGIC</b><small>てのポーズでまほうあそび</small></span>
        </a>
        <div class="topbar-right">
          <span id="camera-status" class="connection"><i></i> カメラおやすみ中</span>
          <span id="points-display" class="points">✦ <b>0</b> MP</span>
          <button class="icon-button" id="help-button" aria-label="あそびかた">📖</button>
          <button class="button camera-toggle" id="camera-toggle" type="button">✋ カメラであそぶ</button>
        </div>
      </header>

      <main id="app" aria-live="polite"></main>

      <footer class="footer">
        <span>HAND MAGIC</span><span>あなたの手が、魔法になる。</span><span>カメラの映像はこのパソコンの中だけで使うよ</span>
      </footer>
    </div>

    <video id="camera-video" class="camera-video" autoplay playsinline muted></video>
    <div id="gesture-pointer" class="gesture-pointer" aria-hidden="true"><span>つまんで きめる</span></div>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
